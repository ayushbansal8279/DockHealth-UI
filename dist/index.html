<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />

    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link
      rel="shortcut icon"
      href="assets/img/favicon.png"
      type="image/x-icon"
    />
    <title>DOCK</title>

    <link rel="stylesheet" href="assets/css/app.css" />

    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700|Roboto+Condensed:300,400,700|Roboto:300,400,500,600,700&display=swap"
      rel="stylesheet"
    />

    <script src="https://js.stripe.com/v3/"></script>
    <script type='module' src ='script/dockhealth-widget-sdk-internal.js'></script>
    <script type="text/javascript" src="" crossorigin="anonymous"></script>
    
    <style>
      .mainContainer {
        display: flex;
        flex-direction: row;
        height: 100vh;
        width: 100%;
      }
      .leftSide {
        align-items: center;
        background-color: #213a56;
        background-image: linear-gradient(to bottom, #213a56, #213a56),
          url('img/bubble-pattern-top.svg'),
          url('img/bubble-pattern-bottom.svg');
        background-repeat: repeat-x;
        background-position: bottom, top;
        display: flex;
        max-width: 642px;
        justify-content: center;
        padding-left: 7rem;
        padding-right: 7rem;
        padding-bottom: 0;
        width: 50%;
      }
      .leftSideContent {
        color: #ffffff;
        width: 100%;
        height: auto;
      }
      .rightSide {
        align-items: center;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-left: 7rem;
        padding-right: 7rem;
      }

      .rightSideContent {
        width: 100%;
        height: auto;
      }

      #currentLink {
        color: #0ca1c7;
      }

      @media screen and (max-width: 960px) {
        .mainContainer {
          flex-direction: column;
        }
        .leftSide {
          max-width: unset;
          padding: 1.5rem;
          width: 100%;
        }
      }

      @media screen and (min-height: 750px) {
        .leftSide {
          padding-bottom: 7rem;
        }
      }

      @media screen and (min-width: 960px) {
        .leftSideContent {
          max-width: 525px;
        }
        .rightSide {
          height: 100%;
          display: flex;
          flex-direction: column;
          flex: 1;
          justify-content: center;
          align-items: center;
        }
        .rightSideContent {
          max-height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="UnsupportedSection" style="display:none">
      <div class="mainContainer">
        <div class="leftSide">
          <div class="leftSideContent">
            <div>
              <img
                src="https://app.dock.health/assets/img/dock-logo.png"
                width="242px"
                height="108px"
              />
              <div style="height:50px"></div>
              <h4 style="font-family: 'Montserrat', sans-serif; ">
                A simple, HIPAA-compliant task management and collaboration
                platform built specifically for healthcare.
              </h4>
            </div>
          </div>
        </div>
        <div class="rightSide">
          <div class="rightSideContent">
            <div>
              <img href="img/dock-header-logo.svg" />
              <div style="height:50px"></div>
              <h3 style="font-family: 'Montserrat', sans-serif; ">
                Dock Health is not supported on the Internet Explorer browser.
              </h3>
              <h4>
                Please use
                <a href="https://www.google.com/chrome/" target="_blank"
                  >Google Chrome</a
                >, Firefox or Safari
              </h4>
              <br />
              <h4>
                You may open this link <span id="currentLink"></span> in any of
                the above browsers.
              </h4>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let userAgentString = navigator.userAgent;
      console.log(userAgentString);

      // Detect Chrome
      // let chromeAgent =
      //     userAgentString.indexOf("Chrome") > -1;

      // Detect Internet Explorer
      let IExplorerAgent =
        userAgentString.indexOf('MSIE') > -1 ||
        (userAgentString.indexOf('rv:') > -1 &&
          userAgentString.indexOf('Firefox') == -1);

      // if(chromeAgent){
      //   alert('detected Chrome');
      // }
      if (IExplorerAgent) {
        // alert('detected IE');
        // document.write('<h2>Dock Health is not supported on IE.</h2><h2>Please use Chrome, Firefox or Safari.</h2><br/>Open this link: <a href="'+window.location.href+'">'+window.location.href+'</a>');
        document.getElementById('UnsupportedSection').style.display = 'block';
        document.getElementById('currentLink').innerText = window.location.href;
      } else {
        document.write('<div id="app" />');
      }
    </script>

</html>

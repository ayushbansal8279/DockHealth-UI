version: 0.2
env:
  parameter-store:
    VITE_AWS_REGION: /DOCK_WEB/TEST/AWS_REGION
    VITE_AWS_USERPOOLID: /DOCK_WEB/TEST/AWS_USERPOOLID
    VITE_AWS_CLIENTAPP: /DOCK_WEB/TEST/AWS_CLIENTAPP
    VITE_HEYDOC_SERVICES_BASE_URL: /DOCK_WEB/TEST/HEYDOC_SERVICES_BASE_URL
    VITE_SYSTEM_TIMEOUT: /DOCK_WEB/TEST/SYSTEM_TIMEOUT
    VITE_HEALTHCHECK_INTERVAL: /DOCK_WEB/TEST/HEALTHCHECK_INTERVAL
    VITE_BRANCH_IO_APP_LINK: /DOCK_WEB/TEST/BRANCH_IO_APP_LINK
    VITE_PUSHER_APP_KEY: /DOCK_WEB/TEST/PUSHER_APP_KEY
    VITE_PUSHER_CLUSTER_NAME: /DOCK_WEB/TEST/PUSHER_CLUSTER_NAME
    VITE_SUBSCRIPTION_TOKEN_API_KEY: /DOCK_WEB/TEST/SUBSCRIPTION_TOKEN_API_KEY
    VITE_GA_TRACKING_CODE: /DOCK_WEB/TEST/GA_TRACKING_CODE
    VITE_GA_TRACKING_CODE_ROLLUP: /DOCK_WEB/TEST/GA_TRACKING_CODE_ROLLUP
    VITE_HELLOSIGN_CLIENT_ID: /DOCK_WEB/TEST/HELLOSIGN_CLIENT_ID
    VITE_HELLOSIGN_DOMAIN_VERIFICATION_ENABLED: /DOCK_WEB/TEST/HELLOSIGN_DOMAIN_VERIFICATION_ENABLED
    VITE_INTERCOM_APP_CODE: /DOCK_WEB/TEST/INTERCOM_APP_CODE
    VITE_PHONE_COUNTRY_CODES: /DOCK_WEB/TEST/PHONE_COUNTRY_CODES
    DYNATRACE_SCRIPT: /DOCK_WEB/TEST/DYNATRACE_SCRIPT
    VITE_GOOGLE_DRIVE_API_CLIENT_ID: /DOCK_WEB/TEST/GOOGLE_DRIVE_API_CLIENT_ID
    VITE_GOOGLE_DRIVE_API_KEY: /DOCK_WEB/TEST/GOOGLE_DRIVE_API_KEY
    VITE_SSO_LAUNCH_URL_GOOGLE: /DOCK_WEB/TEST/SSO_LAUNCH_URL_GOOGLE
    VITE_SENDBIRD_APP_ID: /DOCK_WEB/TEST/SENDBIRD_APP_ID
    VITE_APP_ENV: /DOCK_WEB/TEST/APP_ENV
phases:
  install:
    runtime-versions:
      nodejs: 14
  pre_build:
    commands:
      - echo Installing source NPM dependencies...
      - npm install
      - npm audit fix
      - node -e 'console.log(v8.getHeapStatistics().heap_size_limit/(1024*1024))'
      - export NODE_OPTIONS="--max-old-space-size=4096"
  build:
    commands:
      - echo Build started on `date`
      - npm run build
  post_build:
    commands:
      - aws s3 cp --recursive --acl public-read ./dist s3://$DeployBucketName/
      - aws s3 cp --acl public-read --cache-control='max-age=0, no-cache, no-store, must-revalidate' ./dist/index.html s3://$DeployBucketName/
      - aws cloudfront create-invalidation --distribution-id $CloudFrontDistributionID --paths /index.html /static /assets /*.js
artifacts:
  files:
    - '**/*'
  base-directory: dist
